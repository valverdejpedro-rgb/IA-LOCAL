<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat local</title>
<style>
:root{--bg:#e9eef0;--sf:#f7fafa;--ink:#14262d;--mute:#5b7077;--ac:#0e7c86;--acx:#fff;--me:#d3e6e8;--ln:#c9d6d9;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#10201f;--sf:#172b2a;--ink:#e3eeec;--mute:#8aa3a0;--ac:#4fc1c0;--acx:#0c1a19;--me:#1f3f3e;--ln:#2a4543;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
aside{width:250px;background:var(--sf);border-right:1px solid var(--ln);display:flex;flex-direction:column;padding:14px;gap:10px;flex-shrink:0}
aside h1{font:600 17px Georgia,serif;margin:0 0 4px}
.new{background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:9px;font-weight:600}
#list{overflow:auto;display:flex;flex-direction:column;gap:2px;flex:1}
.ch{display:flex;align-items:center;border-radius:8px;padding:7px 9px;gap:6px;cursor:pointer}
.ch:hover,.ch.on{background:var(--me)}
.ch span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch button{background:none;border:0;color:var(--mute);padding:0 4px;font-size:16px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--ln);background:var(--sf);flex-wrap:wrap}
#menu{display:none;background:none;border:1px solid var(--ln);border-radius:8px;padding:4px 10px}
select{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:6px 8px;max-width:220px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--ac)}
label.sw{display:flex;align-items:center;gap:6px;color:var(--mute);cursor:pointer}
.gap{flex:1}
.gear{background:none;border:1px solid var(--ln);border-radius:8px;padding:5px 10px}
#cfg{display:none;padding:12px 18px;border-bottom:1px solid var(--ln);background:var(--sf);gap:12px;flex-wrap:wrap}
#cfg.on{display:flex}
#cfg label{display:flex;flex-direction:column;gap:3px;color:var(--mute);font-size:13px}
#cfg input,#cfg textarea{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:6px 8px;color:var(--ink)}
#msgs{flex:1;overflow:auto;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.wrap{width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.m{max-width:100%}
.m.user{align-self:flex-end;background:var(--me);border-radius:14px 14px 4px 14px;padding:9px 14px;max-width:85%}
.m.assistant .tx{font:17px/1.65 Charter,Georgia,serif}
.st{margin-top:6px;font-size:12.5px;color:var(--mute)}
.th{margin-bottom:8px;color:var(--mute);font-size:13.5px;white-space:pre-wrap;border-left:3px solid var(--ln);padding-left:10px}
.th summary{cursor:pointer}
code{background:var(--me);border-radius:4px;padding:1px 5px;font:13.5px Consolas,monospace}
.code{position:relative;margin:8px 0}
.code pre{margin:0;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;overflow:auto;font:13.5px/1.5 Consolas,monospace}
.cp{position:absolute;top:6px;right:6px;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:2px 8px;font-size:12px}
.empty{margin:auto;text-align:center;color:var(--mute);max-width:360px}
.empty b{display:block;color:var(--ink);font:600 20px Georgia,serif;margin-bottom:6px}
#warn{display:none;margin:0 18px;padding:9px 12px;border-radius:8px;background:var(--me);font-size:14px}
#warn.on{display:block}
form{padding:12px 18px 18px}
.box{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:8px}
textarea#in{flex:1;border:0;background:none;resize:none;max-height:180px;padding:6px 8px;outline:none}
#go{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:8px 16px;font-weight:600}
#vo.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
a{color:var(--ac)}
@media(max-width:720px){aside{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s}aside.on{transform:none}#menu{display:block}}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<aside id="side">
  <h1>Chat local</h1>
  <small id="ver" style="color:var(--mute)"></small>
  <button class="new" id="new">Nuevo chat</button>
  <div id="list"></div>
</aside>
<main>
  <header>
    <button id="menu">Chats</button>
    <span class="dot" id="dot" title="Conexión con Ollama"></span>
    <select id="model" aria-label="Modelo"></select>
    <label class="sw"><input type="checkbox" id="think"> Razonar (más lento)</label>
    <label class="sw"><input type="checkbox" id="search"> Buscar en internet</label>
    <button type="button" class="gear" id="vo">Modo voz</button>
    <span class="gap"></span>
    <button class="gear" id="gear">Ajustes</button>
  </header>
  <div id="cfg">
    <label>Dirección de Ollama<input id="host" size="26"></label>
    <label>Clave API de Ollama (búsqueda web completa)<input id="key" type="password" size="24" placeholder="opcional" autocomplete="off"></label>
    <label>Idioma de voz<select id="lang"><option value="es-419">Español (Latinoamérica)</option><option value="es-MX">Español (México)</option><option value="es-ES">Español (España)</option></select></label>
    <label>Contexto (tokens)<input id="ctx" type="number" min="1024" step="1024" style="width:130px"></label>
    <label style="flex:1;min-width:220px">Instrucción de sistema (opcional)<textarea id="sys" rows="2"></textarea></label>
  </div>
  <div id="warn"></div>
  <div id="msgs"><div class="wrap" id="wrap"></div></div>
  <form id="f">
    <div class="box">
      <textarea id="in" rows="1" placeholder="Escribe tu mensaje. Enter envía, Shift+Enter hace salto de línea."></textarea>
      <button id="go" type="submit">Enviar</button>
    </div>
  </form>
</main>
<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let S=Object.assign({host:'http://localhost:11434',model:'',think:false,ctx:8192,system:'',key:'',search:false,lang:'es-419'},store.get('s',{}));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let voice=false,rec=null,listening=false,useW=!SR,mstream=null,wpipe=null;
let chats=store.get('c',[]),cur=null,ctrl=null;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const chat=()=>chats.find(c=>c.id===cur);
const save=()=>{store.set('c',chats);store.set('s',S)};

function md(t){return t.split('```').map((p,i)=>{
  if(i%2){const n=p.indexOf('\n');const code=n>=0?p.slice(n+1):p;return `<div class="code"><button type="button" class="cp">Copiar</button><pre>${esc(code.replace(/\n$/,''))}</pre></div>`}
  return esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')
}).join('')}

function fill(d,m){
  let h='';
  if(m.thinking)h+=`<details class="th" ${m.pending&&!m.content?'open':''}><summary>Razonamiento</summary>${esc(m.thinking)}</details>`;
  h+=`<div class="tx">${m.role==='user'?esc(m.content).replace(/\n/g,'<br>'):md(m.content||(m.pending?'…':''))}</div>`;
  if(m.stats)h+=`<div class="st">${m.stats}</div>`;
  if(m.sources&&m.sources.length)h+=`<div class="st">Fuentes: ${m.sources.filter(s=>/^https?:/.test(s.url)).map(s=>`<a href="${esc(s.url).replace(/"/g,'%22')}" target="_blank" rel="noopener">${esc(s.title||'enlace')}</a>`).join(' · ')}</div>`;
  d.innerHTML=h;
}
function draw(){
  const w=$('#wrap');w.innerHTML='';const c=chat();
  if(!c||!c.messages.length){w.innerHTML='<div class="empty"><b>Tu modelo, en tu PC</b>Sin cuotas ni límites. Escribe abajo para empezar.</div>';return}
  c.messages.forEach(m=>{const d=document.createElement('div');d.className='m '+m.role;fill(d,m);w.appendChild(d)});
  down();
}
function paint(m){const c=chat();const i=c.messages.indexOf(m);const d=$('#wrap').children[i];if(d){fill(d,m);down()}}
function down(){const e=$('#msgs');e.scrollTop=e.scrollHeight}
function list(){
  const l=$('#list');l.innerHTML='';
  chats.slice().reverse().forEach(c=>{
    const d=document.createElement('div');d.className='ch'+(c.id===cur?' on':'');
    d.innerHTML=`<span>${esc(c.title)}</span><button type="button" title="Borrar chat" aria-label="Borrar chat">×</button>`;
    d.onclick=e=>{if(e.target.tagName==='BUTTON'){chats=chats.filter(x=>x.id!==c.id);if(cur===c.id)cur=chats.length?chats[chats.length-1].id:null;if(!cur)make();save()}else cur=c.id;list();draw();$('#side').classList.remove('on')};
    l.appendChild(d);
  });
}
function make(){const c={id:Date.now(),title:'Chat nuevo',messages:[]};chats.push(c);cur=c.id;list();draw();save()}
function warn(t){const w=$('#warn');w.textContent=t||'';w.classList.toggle('on',!!t)}
function busy(b){$('#go').textContent=b?'Detener':'Enviar'}

async function models(){
  try{
    const r=await fetch(S.host+'/api/tags');const j=await r.json();
    const ms=(j.models||[]).map(m=>m.name);const sel=$('#model');
    sel.innerHTML=ms.map(n=>`<option>${esc(n)}</option>`).join('');
    if(!ms.includes(S.model))S.model=ms[0]||'';
    sel.value=S.model;$('#dot').classList.add('ok');warn(ms.length?'':'Ollama responde, pero no hay modelos instalados.');
  }catch{$('#dot').classList.remove('ok');warn('No se pudo conectar con Ollama. Revisa que esté abierto. Si abriste este archivo con doble clic, crea la variable de entorno OLLAMA_ORIGINS con valor * y reinicia Ollama.')}
}

async function send(){
  if(ctrl){ctrl.abort();return}
  const inp=$('#in'),txt=inp.value.trim();if(!txt)return;
  if(!S.model){warn('Elige un modelo primero.');return}
  warn('');inp.value='';grow();
  const c=chat();
  c.messages.push({role:'user',content:txt});if(c.messages.length===1){c.title=txt.slice(0,40);list()}
  const a={role:'assistant',content:'',pending:true};c.messages.push(a);draw();save();
  ctrl=new AbortController();busy(true);const t0=performance.now();
  try{
    let extra='';
    if(S.search){
      paint(a);const res=await webSearch(txt);
      if(res.length){a.sources=res.map(({title,url})=>({title,url}));extra='Resultados de búsqueda en internet ('+new Date().toLocaleDateString('es')+'):\n'+res.map((x,i)=>`[${i+1}] ${x.title}: ${x.content}`).join('\n')+'\n\nUsa estos resultados si ayudan a responder; si no son útiles, dilo.\n\nPregunta: '}
    }
    const hist=c.messages.slice(0,-1).map(({role,content})=>({role,content}));
    hist[hist.length-1].content=extra+hist[hist.length-1].content;
    const budget=S.ctx*0.6*3.5;let used=0;const keep=[];
    for(let i=hist.length-1;i>=0;i--){used+=hist[i].content.length;if(used>budget&&keep.length)break;keep.unshift(hist[i])}
    const sys=[S.system,voice?'Responde en español, breve y conversacional, sin listas ni formato.':''].filter(Boolean).join(' ');
    const msgs=(sys?[{role:'system',content:sys}]:[]).concat(keep);
    const r=await fetch(S.host+'/api/chat',{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:S.model,messages:msgs,stream:true,think:S.think,options:{num_ctx:S.ctx}})});
    if(!r.ok)throw new Error(await r.text()||r.status);
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
      for(const l of ls){
        if(!l.trim())continue;const j=JSON.parse(l);if(j.error)throw new Error(j.error);
        const m=j.message||{};if(m.thinking)a.thinking=(a.thinking||'')+m.thinking;if(m.content)a.content+=m.content;
        if(j.done&&j.eval_count&&j.eval_duration)a.stats=`${((performance.now()-t0)/1000).toFixed(1)} s · ${(j.eval_count/(j.eval_duration/1e9)).toFixed(1)} tok/s`;
      }
      paint(a);
    }
  }catch(e){
    if(e.name!=='AbortError'){a.content+=(a.content?'\n\n':'')+'Error: '+e.message;if(e instanceof TypeError)models()}
  }
  a.pending=false;ctrl=null;busy(false);paint(a);save();
  if(voice)speak(a.content);
}

async function webSearch(q){
  q=q.slice(0,200);
  if(S.key){try{
    const r=await fetch('https://ollama.com/api/web_search',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.key},body:JSON.stringify({query:q,max_results:4})});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    return (j.results||[]).map(x=>({title:x.title,url:x.url,content:(x.content||'').slice(0,600)}));
  }catch(e){warn('La búsqueda con Ollama falló ('+e.message+'). Uso Wikipedia como respaldo.')}}
  try{
    const u='https://es.wikipedia.org/w/api.php?action=query&generator=search&gsrlimit=3&prop=extracts&exintro=1&explaintext=1&exchars=700&format=json&origin=*&gsrsearch='+encodeURIComponent(q);
    const j=await (await fetch(u)).json();
    return Object.values((j.query||{}).pages||{}).sort((x,y)=>x.index-y.index).map(p=>({title:p.title,url:'https://es.wikipedia.org/?curid='+p.pageid,content:p.extract||''}));
  }catch{warn('No se pudo buscar en internet.');return []}
}

function listen(){
  if(!voice||ctrl||listening||speechSynthesis.speaking)return;
  if(useW){listenW();return}
  rec=new SR();rec.lang=S.lang;rec.interimResults=true;rec.continuous=false;
  rec.onstart=()=>{listening=true};
  rec.onresult=e=>{
    let t='';for(const r of e.results)t+=r[0].transcript;
    $('#in').value=t;grow();
    if(e.results[e.results.length-1].isFinal)send();
  };
  rec.onerror=e=>{
    if(e.error==='no-speech'||e.error==='aborted')return;
    if(e.error==='network'||e.error==='service-not-allowed'){useW=true;warn('Este navegador no ofrece reconocimiento de voz propio. Uso un modelo local.');return}
    const m={'not-allowed':'El navegador bloqueó el micrófono. Permítelo en el candado de la barra de direcciones.','service-not-allowed':'El navegador no permite el reconocimiento de voz en esta página. Prueba abriendo el chat desde http://localhost (ver instrucciones) o usa Chrome o Edge.','audio-capture':'No se detecta ningún micrófono. Revisa el micrófono predeterminado en Windows.','network':'El reconocimiento de voz necesita internet y no pudo conectarse.'};
    voiceOff();warn(m[e.error]||('Error de voz: '+e.error));
  };
  rec.onend=()=>{listening=false;if(voice&&!ctrl&&!speechSynthesis.speaking)setTimeout(listen,300)};
  try{rec.start()}catch{}
}
async function loadWhisper(){
  if(wpipe)return wpipe;
  warn('Descargando el modelo de voz (unos 80 MB, solo la primera vez)…');
  const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
  env.allowLocalModels=false;
  wpipe=await pipeline('automatic-speech-recognition','Xenova/whisper-base');
  warn('');return wpipe;
}
async function listenW(){
  if(!voice||ctrl||listening||speechSynthesis.speaking)return;
  listening=true;
  try{
    if(!mstream)mstream=await navigator.mediaDevices.getUserMedia({audio:true});
    const p=await loadWhisper();if(!voice)return;
    const chunks=[],mr=new MediaRecorder(mstream);mr.ondataavailable=e=>chunks.push(e.data);
    const ac=new AudioContext(),an=ac.createAnalyser();an.fftSize=1024;
    ac.createMediaStreamSource(mstream).connect(an);
    const buf=new Uint8Array(an.fftSize);let spoke=false;const start=performance.now();let last=start;
    mr.start();
    await new Promise(res=>{const iv=setInterval(()=>{
      an.getByteTimeDomainData(buf);let s=0;for(const v of buf)s+=(v-128)*(v-128);
      const now=performance.now();if(Math.sqrt(s/buf.length)>8){spoke=true;last=now}
      if(!voice||(spoke&&now-last>1200)||(!spoke&&now-start>8000)||now-start>30000){clearInterval(iv);res()}
    },60)});
    await new Promise(r=>{mr.onstop=r;mr.stop()});ac.close();
    if(!voice)return;
    if(!spoke){setTimeout(listenW,200);return}
    const ab=await new Blob(chunks).arrayBuffer();
    const c16=new AudioContext({sampleRate:16000});
    const audio=(await c16.decodeAudioData(ab)).getChannelData(0);c16.close();
    warn('Transcribiendo…');
    const out=await p(audio,{language:'spanish',task:'transcribe'});warn('');
    const t=(out.text||'').trim();
    if(t){$('#in').value=t;grow();send()}else setTimeout(listenW,200);
  }catch(e){voiceOff();warn('Voz local: '+(e.message||e.name||e))}
  finally{listening=false}
}
function speak(t){
  t=t.replace(/```[\s\S]*?```/g,' bloque de código. ').replace(/https?:\/\/\S+/g,'').replace(/[*_`#>]/g,'').trim();
  if(!t||t.startsWith('Error:')){listen();return}
  const parts=(t.match(/[^.!?\n]+[.!?]*/g)||[t]).map(s=>s.trim()).filter(Boolean);
  const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith(S.lang.slice(0,2)));
  parts.forEach((p,i)=>{
    const u=new SpeechSynthesisUtterance(p);u.lang=S.lang;if(v)u.voice=v;
    if(i===parts.length-1)u.onend=u.onerror=()=>{if(voice)listen()};
    speechSynthesis.speak(u);
  });
}
function voiceOff(){voice=false;if(rec)try{rec.abort()}catch{}if(mstream){mstream.getTracks().forEach(t=>t.stop());mstream=null}speechSynthesis.cancel();$('#vo').classList.remove('on');$('#vo').textContent='Modo voz'}
function voiceToggle(){
  if(voice){voiceOff();return}
  voice=true;$('#vo').classList.add('on');$('#vo').textContent='Escuchando… (clic para salir)';listen();
}

function grow(){const t=$('#in');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,180)+'px'}
$('#f').onsubmit=e=>{e.preventDefault();send()};
$('#in').oninput=grow;
$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('#new').onclick=()=>{make();$('#side').classList.remove('on')};
$('#menu').onclick=()=>$('#side').classList.toggle('on');
$('#gear').onclick=()=>$('#cfg').classList.toggle('on');
$('#model').onchange=e=>{S.model=e.target.value;save()};
$('#think').onchange=e=>{S.think=e.target.checked;save()};
$('#host').onchange=e=>{S.host=e.target.value.trim().replace(/\/$/,'');save();models()};
$('#ctx').onchange=e=>{S.ctx=Math.max(1024,+e.target.value||8192);save()};
$('#sys').onchange=e=>{S.system=e.target.value;save()};
$('#wrap').onclick=e=>{if(e.target.classList.contains('cp')){const t=e.target.nextElementSibling.textContent;navigator.clipboard.writeText(t).then(()=>{e.target.textContent='Copiado';setTimeout(()=>e.target.textContent='Copiar',1200)})}};

const VERSION='1.1.0';
$('#ver').textContent='Versión '+VERSION;
$('#vo').onclick=voiceToggle;
$('#key').onchange=e=>{S.key=e.target.value.trim();save()};
$('#lang').onchange=e=>{S.lang=e.target.value;save()};
$('#search').onchange=e=>{S.search=e.target.checked;save();if(S.search&&!S.key)warn('Sin clave de Ollama busco solo en Wikipedia. Añade la clave en Ajustes para búsqueda web completa.')};
$('#key').value=S.key;$('#lang').value=S.lang;$('#search').checked=S.search;
$('#think').checked=S.think;$('#host').value=S.host;$('#ctx').value=S.ctx;$('#sys').value=S.system;
if(chats.length)cur=chats[chats.length-1].id;else make();
list();draw();models();
</script>
</body>
</html>
